services:
  frontend:
    build: ./frontend
    image: tp/frontend:1.0
    ports: ["8081:8080"]
    depends_on:
      api: { condition: service_healthy }
    networks: [front-net]
    restart: unless-stopped

  api:
    build: ./api
    image: tp/api:1.0
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
    networks: [front-net, back-net]   # joint par le front, parle à redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # persistance AOF
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [back-net]               # Redis isolé : inaccessible du front
    restart: unless-stopped

networks:
  front-net:
  back-net:
    internal: true                      # aucun accès externe

volumes:
  redis-data:
