apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tp-conteneurs
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: tp/frontend:1.0
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tp-conteneurs
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }]
