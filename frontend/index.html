<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>TP Conteneurs - Tâches</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem}
li{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid #ddd}
#info{background:#eef;padding:.6rem;border-radius:6px;margin-bottom:1rem;font-size:.9rem}
</style></head><body>
<h1>Gestionnaire de tâches</h1>
<div id="info">Chargement…</div>
<input id="t" placeholder="Nouvelle tâche"> <button onclick="add()">Ajouter</button>
<ul id="list"></ul>
<script>
async function info(){const r=await(await fetch('/api/info')).json();
 document.getElementById('info').textContent=`Servi par : ${r.served_by} — requêtes totales : ${r.total_hits}`;}
async function load(){const l=await(await fetch('/api/tasks')).json();
 document.getElementById('list').innerHTML=l.map(t=>`<li>${t.title.replace(/</g,'&lt;')}<button onclick="del('${t.id}')">x</button></li>`).join('');info();}
async function add(){const i=document.getElementById('t');if(!i.value)return;
 await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:i.value})});i.value='';load();}
async function del(id){await fetch('/api/tasks/'+id,{method:'DELETE'});load();}
load();
</script></body></html>
